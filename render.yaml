services:
  - type: web
    name: muyuy
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /audio/voz/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /lottie/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /data/*
        name: Cache-Control
        value: public, max-age=86400
